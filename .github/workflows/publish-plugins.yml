name: Publish Plugins

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Plugins and Manifests
        run: npm run build:full

      - name: Commit and Push to Plugins Branch with Correct Structure
        run: |
          # Switch to the isolated plugins branch
          git checkout -b plugins/v3.0.0
          
          # Configure identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Force add only the .dist folder
          git add -f .dist
          git commit -m "chore: build and publish plugins [skip ci]"
          
          # Update remote origin with token and push strictly to plugins/v3.0.0
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin plugins/v3.0.0 --force
