name: Publish Plugins

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Plugins and Manifests
        run: npm run build:full

      - name: Commit and Push to Plugins Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Initialize a separate git workspace inside .dist for the isolated branch push
          cd .dist
          git init
          git checkout -b plugins/v3.0.0
          git add .
          git commit -m "chore: build and publish plugins [skip ci]"
          
          # Force push the contents of .dist directly to the remote plugins/v3.0.0 branch
          git remote add origin https://github.com/${{ github.repository }}.git
          git push origin plugins/v3.0.0 --force
